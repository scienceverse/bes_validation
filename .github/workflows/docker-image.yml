# Builds the Docker image of this repository on GitHub's computers and publishes it
# as ghcr.io/scienceverse/bes_validation:
#   - on every push to main, as "latest" and as the short code of the commit;
#   - on every version tag, with the version as its name (tag v1.0 -> image 1.0).
# The build rebuilds the whole paper from the data and fails, so nothing is published,
# if any number in the rebuilt manuscript differs from documentation/manuscript.pdf.
# It can also be started by hand, under Actions -> Docker image -> Run workflow.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The image is about 6 GB; the machine has too little free space without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged steps (R, packages, Quarto, LaTeX) from earlier runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
